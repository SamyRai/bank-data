name: 'GoSec Security Scan'
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  gosec:
    name: Run GoSec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GoSec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.3
      - name: Select Go package targets
        id: targets
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed_files=$(git diff --name-only "$base_ref"...HEAD -- '*.go')
          else
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              changed_files=$(git diff --name-only HEAD^ HEAD -- '*.go')
            else
              changed_files=$(git ls-files '*.go')
            fi
          fi

          if [[ -z "$changed_files" ]]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          targets=$(
            printf '%s\n' "$changed_files" \
              | xargs -n1 dirname \
              | sort -u \
              | sed 's#^#./#' \
              | tr '\n' ' '
          )

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
      - name: Run GoSec
        if: steps.targets.outputs.targets != ''
        run: gosec ${{ steps.targets.outputs.targets }}
      - name: No Go package changes
        if: steps.targets.outputs.targets == ''
        run: echo "No changed Go package targets to scan."
