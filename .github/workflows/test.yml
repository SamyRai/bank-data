name: Test & Coverage

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Go tests & upload coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        run: |
          go test -coverprofile=coverage.out ./...
      - name: Race checks (core packages)
        run: |
          go test -race ./pkg/financial ./pkg/iban ./pkg/bic ./pkg/sepa ./pkg/validation
      - name: Fuzz smoke (IBAN)
        run: |
          go test -run=^$ -fuzz=FuzzIBANValidate -fuzztime=3s ./pkg/iban
      - name: Benchmark smoke
        run: |
          go test -run=^$ -bench=BenchmarkService_Validate_Matrix -benchtime=1x ./pkg/iban
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
          verbose: true
