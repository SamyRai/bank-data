name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  golangci-lint:
    name: Run golangci-lint v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.3
      - name: Run golangci-lint
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            golangci-lint run --timeout=5m --new-from-rev=origin/${{ github.base_ref }}
          else
            golangci-lint run --timeout=5m
          fi
